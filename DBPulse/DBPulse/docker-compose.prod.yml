version: "3.8"

services:
  web:
    image: ghcr.io/gokulsenthilkumar3/dbpulse-web:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dbpulse

  api:
    image: ghcr.io/gokulsenthilkumar3/dbpulse-api:latest
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dbpulse

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dbpulse

volumes:
  redis_data:

networks:
  dbpulse:
    driver: bridge
