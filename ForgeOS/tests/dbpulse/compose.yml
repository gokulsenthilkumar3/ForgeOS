services:
  source:
    image: postgres:16-alpine
    container_name: dbpulse-fixture-pg
    environment:
      POSTGRES_USER: fixture_admin
      POSTGRES_DB: dbpulse_source
      POSTGRES_PASSWORD: ${DBPULSE_FIXTURE_PASSWORD:?Temporary fixture password required}
    volumes: [./pg-init.sh:/docker-entrypoint-initdb.d/10-dbpulse.sh:ro]
    networks: [fixture]
    labels: { com.forgeos.fixture: dbpulse }
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fixture_admin -d dbpulse_source']
      interval: 3s
      timeout: 3s
      retries: 30
  target:
    image: mysql:8.4
    container_name: dbpulse-fixture-mysql
    environment:
      MYSQL_DATABASE: dbpulse_target
      MYSQL_ROOT_PASSWORD: ${DBPULSE_FIXTURE_PASSWORD:?Temporary fixture password required}
    volumes: [./mysql-init.sh:/docker-entrypoint-initdb.d/10-dbpulse.sh:ro]
    networks: [fixture]
    labels: { com.forgeos.fixture: dbpulse }
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 3s
      timeout: 3s
      retries: 60
networks:
  fixture:
    external: true
    name: forgeos_default
